[project]
name = "praxis"
version = "0.1.0"
description = "Praxis: a video-action policy for robot arms"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Runway" }]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    # transformers needs torchvision to load the processor of Qwen3.5.
    "torchvision>=0.28",
    "triton>=3.7",
    "transformers==5.2.0",
    "safetensors>=0.4",
    "numpy>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/runwayml/praxis-1-oss"
"Tech report" = "https://runway.com/research/praxis-1-video-pretraining-to-robot-control"
Models = "https://huggingface.co/collections/runwayml/praxis-1"

[project.optional-dependencies]
# The text encoder uses these kernels when they are installed. The validation
# results were made with them. Without them the text encoder output differs.
kernels = [
    "flash-linear-attention==0.5.0",
    "causal-conv1d==1.6.1",
]
# mp4 export of the predicted video in scripts/run_inference.py.
video = ["imageio>=2.30", "imageio-ffmpeg>=0.4"]
# The policy server (praxis/serve) and its cloud host. av decodes H.264 image
# stacks. scipy smooths the actions when a session asks for it. A release
# without the server deletes this extra (see praxis/serve/README.md).
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    "msgpack>=1.0",
    "av>=12",
    "scipy>=1.10",
    "modal>=1.2",
]
# The MuJoCo simulation (praxis/sim, scripts/run_sim.py): the praxis-sim package from
# PyPI (packages/praxis-sim of this repository; mujoco, gymnasium, numpy; no torch) and
# the MP4 writer's imageio. To work on the simulator itself in a checkout, install the
# package editable on top: pip install -e packages/praxis-sim.
sim = [
    "praxis-sim>=0.1.0",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
]
# Fine-tuning data (praxis/train/data.py): parquet files, video decode and the Hugging Face hub.
train = ["huggingface_hub>=1.3", "av>=14.0", "pyarrow>=15.0"]
# The autoregressive eval (praxis/eval/autoregressive): the set download, the
# video decode and the judge client of any OpenAI-compatible endpoint.
eval = ["huggingface_hub>=1.3", "av>=14.0", "openai>=1.50"]
# Optional SM120 grouped kernels and CPU weight packing for routed experts.
# The default BF16 loader does not import these packages.
nvfp4 = ["flashinfer-python[cu13]==0.6.18.post1", "torchao==0.17.0", "ninja>=1.11"]
dev = ["pytest>=8", "ruff==0.11.13"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["praxis*"]

[tool.setuptools.package-data]
"praxis.eval" = ["*.json"]
"praxis.eval.autoregressive" = ["*.txt", "*.json"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "E731"]
