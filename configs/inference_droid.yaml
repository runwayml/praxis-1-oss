# praxis inference settings for the single-arm DROID checkpoint.
# Every knob of a run lives in this file.
# The sampler and session values are the recommended settings of this
# checkpoint. They can change.
# Override single values on the command line: --set sampler.num_steps=4
#
# The checkpoint config sets the rest of the variant: the canvas (one tile per
# view; the tile size comes from the checkpoint), the pose frame of the actions and the caption of the
# unguided pass. No key of this file changes them.
#
# The alternative recipe: num_steps 2, t_shift 8.0, cfg_scale 1.0,
# cfg_video_scale 1.0 and max_context_chunks 3.

model:
  checkpoint: checkpoints/praxis-1-droid   # praxis checkpoint directory
  vae_weights: weights/Wan2.2_VAE.pth                  # public Wan2.2 VAE weights
  text_encoder: weights/Qwen3.5-2B                     # public Qwen3.5-2B (Hugging Face layout)
  device: cuda
  # BLOCK_C of the fused VAE norm kernel per channel count. It sets the
  # summation order of the norm. null = the default {160: 64, 320: 64, 640: 256}.
  vae_norm_block_c: null

sampler:
  num_steps: 2           # Euler steps per chunk
  cfg_scale: 1.0         # text guidance scale of the actions (1.0 = off)
  cfg_video_scale: 4.0   # text guidance scale of the video (1.0 = off)
  cfg_batched: false     # no effect with window_joint: the passes run one after the other
  layout: window_joint   # joint Euler over the whole context window
  t_shift: 12.5          # flow shift of the timestep grid
  solver: euler          # window_joint needs euler
  action_steps: null     # window_joint needs null

session:
  exec_horizon: 24                # command rows per call (null = the full chunk)
  control_mode: droid_impedance   # none | droid_impedance
  max_context_chunks: 1           # executed chunks kept as context
  seed: 0                         # chunk k samples with seed + k

input:
  # The repository ships no episodes: set episodes_dir to a directory of your own
  # (or --set input.episodes_dir=<path>).
  episodes_dir: examples/droid_episodes   # one sub-directory per episode
  episodes: all                           # "all" or a list of names
  chunk_starts: [0, 21, 45, 69]           # frame index of each policy call
  stack_frames: 25                        # frames per observation (24 history + current)

output:
  dir: outputs/droid_run
  save_video: true      # decode the predicted chunks to mp4 and npy
