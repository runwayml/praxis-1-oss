# Overfit check of the fine-tuning setup on DROID.
# The run trains on the same 10 windows again and again, with the same random
# values (timesteps, noise, dropout values, rotary offsets) for each use of a
# window. A correct setup thus learns the windows by heart: the loss goes to
# about 0. A loss that does not fall, a NaN or a stop on one GPU shows an
# error in the data, the objective, the trainer or the hardware.
# Run on one node with N GPUs (we ran it on 4):
#   torchrun --nproc_per_node 4 scripts/finetune.py --config configs/finetune_droid_overfit.yaml
# The other values are the values of configs/finetune_droid.yaml.

model:
  checkpoint: checkpoints/praxis-1-droid   # the start weights (praxis checkpoint)
  vae_weights: weights/Wan2.2_VAE.pth                # public Wan2.2 VAE weights
  text_encoder: weights/Qwen3.5-2B                   # public Qwen3.5-2B (Hugging Face layout)
  vae_norm_block_c: null

data:
  source: droid_hires
  split: train
  cache_dir: null
  max_episodes: null
  num_workers: 12              # not used: the 10 windows stay in memory
  text_cache_size: 1024
  # Rank 0 draws the first 10 windows of the train split (data seed of
  # step 0) and encodes them once. All GPUs then use only these windows.
  # Rank r of N at micro-step k of step s uses window
  # ((s * grad_accum + k) * N + r) % 10.
  overfit_windows: 10

objective:
  video_weight: 1.0
  action_weight: 1.0
  video_timestep_shift: 5.0
  text_dropout: 0.0            # no dropout: the inputs of a window do not change
  proprio_dropout: 0.0
  moe_balance_speed: 0.001
  moe_seq_balance_coef: 0.0001
  action_guard: 5.0
  moe_dispatch_chunk_size: 65536
  # The random values of a window come from (train.seed, window index), not
  # from the step. With new random values in each step, the flow-matching
  # loss has a floor well above 0.
  fixed_draws: true

train:
  # Steps and learning rate: a flat 5e-5, much larger than the 3e-6 of the
  # default config, so that the model learns the 10 windows in 600 steps. On 4 H100
  # GPUs, the mean loss of the last 10 steps was 10 % of the loss of step 1
  # after 300 steps and 3.6 % after 600 steps. In 600 steps each window
  # comes back 240 times on 4 GPUs. For a longer check, use
  # --set train.steps=N.
  steps: 600
  grad_accum: 1                # one window per GPU in each step
  lr: 5.0e-5
  warmup_steps: 10             # a short linear warmup
  lr_schedule: flat
  min_lr: 3.0e-7               # not used by the flat schedule
  betas: [0.9, 0.95]
  weight_decay: 0.0            # no decay: it pulls the weights away from a perfect fit
  eps: 1.0e-8
  clip_grad_norm: 1.0
  activation_checkpointing: true
  no_sync: false
  reduce_dtype: float32
  seed: 0
  log_every: 1                 # log each step
  save_every: 100
  save: false                  # the check writes no checkpoint (one save is 163 GB)

output:
  dir: outputs/finetune_droid_overfit
  resume: null
