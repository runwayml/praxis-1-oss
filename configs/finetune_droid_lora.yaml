# LoRA fine-tune of the single-arm checkpoint praxis-1-droid on DROID data:
# the recipe for one 80 GB GPU on the same rig (the DROID Franka with an
# exterior and a wrist camera). The weights of the checkpoint stay frozen;
# low-rank adapters of the action expert train. For a new rig, fine-tune the
# base in full instead (configs/finetune_base.yaml).
#   torchrun --nproc_per_node 1 scripts/finetune.py --config configs/finetune_droid_lora.yaml
# One step uses N GPUs x grad_accum windows: 16 on 1 GPU. Measured on one H100
# 80 GB: 65 GiB peak, 14 to 15 s per step, about 5 hours for 1,200 steps. The
# adapters have few weights, so gradient accumulation adds little memory. More
# GPUs are an option: 6 GPUs give 96 windows per step at about 27 GB per GPU,
# but that larger batch was not measured in the simulation. A save holds the
# merged weights in model/ (a full praxis checkpoint) and the adapters in
# trainable.safetensors.
#
# data.source is the public Hugging Face copy of DROID, so the file runs as it
# is. Its videos are 320x180; point data.source at your own LeRobot tree of
# DROID-rig episodes for your task.

model:
  checkpoint: checkpoints/praxis-1-droid   # the start weights (praxis checkpoint)
  vae_weights: weights/Wan2.2_VAE.pth                # public Wan2.2 VAE weights
  text_encoder: weights/Qwen3.5-2B                   # public Qwen3.5-2B (Hugging Face layout)
  vae_norm_block_c: null

data:
  source: cadene/droid_1.0.1   # a Hugging Face dataset id or a local LeRobot v2.x tree
  split: train
  cache_dir: null
  max_episodes: null
  num_workers: 12
  text_cache_size: 1024
  overfit_windows: null

objective:
  video_weight: 1.0
  action_weight: 1.0
  video_timestep_shift: 5.0
  text_dropout: 0.1
  proprio_dropout: 0.1
  moe_balance_speed: 0.0       # the routers are frozen: no routing bias update
  moe_seq_balance_coef: 0.0001
  action_guard: 5.0
  moe_dispatch_chunk_size: 65536
  fixed_draws: false

lora:
  rank: 16                     # 0 = off (a full fine-tune)
  alpha: 32.0                  # the update is (alpha / rank) * B @ A
  dropout: 0.0
  targets: [expert]            # praxis/train/lora.py LORA_TARGETS, or fnmatch patterns of nn.Linear names
  train_also: []               # fnmatch patterns of parameter names that train in full

train:
  steps: 1200
  grad_accum: 16
  lr: 1.0e-4                   # peak learning rate of the adapters
  warmup_steps: 50
  lr_schedule: cosine
  min_lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  eps: 1.0e-8
  clip_grad_norm: 1.0
  activation_checkpointing: true
  no_sync: false
  reduce_dtype: float32
  seed: 0
  log_every: 1
  save_every: 100              # one save: 54 GB model + the adapters and their optimizer state
  save: true

output:
  dir: outputs/finetune_droid_lora
  resume: null
