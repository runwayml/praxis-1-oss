# praxis policy server settings for the bimanual YAM checkpoint.
# Start: python -m praxis.serve --config configs/serve_yam.yaml
# The sampler and session values are the defaults of the session parameters.
# They are the recommended settings of this checkpoint. They can
# change. A client changes a value for one session in the query of the session
# URL, for example ws://<host>:8000/api/v1/session?sample_seed=0&num_steps=4
#
# The checkpoint config sets the rest of the variant: the canvas (three
# 256x416 tiles: top, left wrist, right wrist), the action layout and the
# caption of the unguided pass. No key of this file changes them. The client
# bounds each view to a 416x416 box with its aspect kept (1920x1200 ->
# 416x260) ahead of the frame stack. The server makes the tiles with the fit
# rule of training (260x416 -> 256x416).
#
# The checkpoint was trained on window captions such as "Pick up the pen from
# the center of the table, then place the pen in the bag", with no closing
# period. The prompt goes to the text encoder verbatim, so send prompts in
# that form.

model:
  checkpoint: checkpoints/praxis-1-yam     # praxis checkpoint directory
  vae_weights: weights/Wan2.2_VAE.pth      # public Wan2.2 VAE weights
  text_encoder: weights/Qwen3.5-2B         # public Qwen3.5-2B (Hugging Face layout)
  embodiment: bimanual                     # the rig of the checkpoint
  device: cuda
  # BLOCK_C of the fused VAE norm kernel per channel count. It sets the
  # summation order of the norm. null = the default {160: 64, 320: 64, 640: 256}.
  vae_norm_block_c: null

sampler:
  num_steps: 2           # Euler steps per chunk
  cfg_scale: 1.0         # text guidance scale of the actions (1.0 = off)
  cfg_video_scale: 1.0   # text guidance scale of the video (1.0 = off)
  cfg_batched: false     # no effect with window_joint: the passes run one after the other
  layout: window_joint   # joint Euler over the whole context window
  t_shift: 1.0           # flow shift of the timestep grid
  solver: euler          # window_joint needs euler
  action_steps: null     # window_joint needs null

session:
  exec_horizon: 24                # command rows per call (null = the full chunk)
  control_mode: none              # the bimanual rig has no other mode
  context_mode: observed          # observed | stateless
  max_context_chunks: 1           # executed chunks kept as context
  carry_mode: clean               # clean | zeros (no effect on this checkpoint)
  prompt: ""                      # task string until the robot sends one
