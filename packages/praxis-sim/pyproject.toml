[project]
name = "praxis-sim"
version = "0.1.0"
description = "The MuJoCo single-arm rig of Praxis-1 and its evaluation suites, as Gymnasium environments"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Runway" }]
# 3.10 and up, so the simulator installs next to other sim stacks and in LeRobot
# environments; the praxis package itself needs 3.12.
requires-python = ">=3.10"
# No torch: the model loop, the video writer and the live viewer stay in the praxis package.
# The scene code uses the MjSpec API, which changes between MuJoCo minor versions.
dependencies = [
    "numpy>=2.0",
    "mujoco>=3.16.0,<3.17",
    "gymnasium>=1.1.1,<2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/runwayml/praxis-1-oss"
Documentation = "https://github.com/runwayml/praxis-1-oss/tree/main/packages/praxis-sim"

# setuptools 77 is the first to read the SPDX `license` string and `license-files` (PEP 639).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis_sim*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "E731"]
